# Use https://app.stepsecurity.io/ to improve workflow security
name: Create Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: read

jobs:
  testing:
    name: Testing
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Check
      run: make check

  create_release:
    permissions:
      contents: write
    name: Create Release
    needs: [testing]
    runs-on: ubuntu-latest
    steps:
    # actions/create-release@v1 fails when the release already exists (e.g. created by
    # `gh release create` before the tag workflow runs) and used github.ref
    # ("refs/tags/vX.Y.Z") as the tag name. Ensure the release exists idempotently.
    - name: Ensure GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
          echo "Release $TAG already exists — reusing"
        else
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes
        fi

  publish:
    permissions:
      contents: write
    name: Publish
    needs: [testing, create_release]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Distribute
      run: make dist

    - name: Upload release asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      shell: bash
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = "Linux" ]; then
          asset=./bin/imagecashletter-linux-amd64
        elif [ "$RUNNER_OS" = "macOS" ]; then
          asset=./bin/imagecashletter-darwin-amd64
        else
          asset=./bin/imagecashletter.exe
        fi
        gh release upload "$TAG" "$asset" --repo "$REPO" --clobber

  webui:
    permissions:
      contents: write
      pull-requests: write
    name: WebUI
    needs: [testing, create_release]
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
      id: go

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Switch to master
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
      run: |
        git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
        git fetch origin
        git checkout master

    # persist-credentials is false (zizmor), so origin needs the token like moov-io/ach.
    # The default-branch ruleset still requires a pull request, and GitHub Actions
    # cannot be added as a bypass actor on this org, so fall back to opening and
    # merging a PR when a direct push to master is rejected.
    - name: Distribute
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        make build-webui
        git config user.name "moov-bot"
        git config user.email "oss@moov.io"
        git add ./docs/webui/assets/wasm_exec.js ./docs/webui/assets/imagecashletter.wasm
        if git diff --cached --quiet; then
          echo "No wasm changes to commit"
          exit 0
        fi
        git commit -m "chore: updating wasm webui [skip ci]"
        if git push origin HEAD:master; then
          echo "Pushed wasm to master"
          exit 0
        fi
        echo "Direct push to master was rejected; opening a pull request"
        branch="chore/wasm-webui-${GITHUB_REF_NAME}"
        git push origin "HEAD:refs/heads/${branch}"
        pr_url=$(gh pr create --title "chore: updating wasm webui [skip ci]" --body "Rebuild the WASM webui for ${GITHUB_REF_NAME}." --base master --head "$branch")
        gh pr merge "$pr_url" --squash --delete-branch --subject "chore: updating wasm webui [skip ci]"

  docker:
    name: Docker
    if: github.repository_owner == 'moov-io' && !github.event.repository.fork
    needs: [testing, create_release]
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    - name: Docker
      run: make docker

    - name: Docker Push
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
        make release-push

    - name: Quay.io Push
      env:
        DOCKER_USERNAME: ${{ secrets.QUAY_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      run: |
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin quay.io
        make quay-push
